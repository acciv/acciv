<svg xmlns="http://www.w3.org/2000/svg" width="854" height="220" viewBox="0 0 854 220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" xml:space="preserve"><style>
.k{animation:kb 1.1s steps(1) infinite}@keyframes kb{50%{opacity:0}}
.f{animation:fi 5s infinite}@keyframes fi{0%,96%,100%{opacity:1}98%{opacity:.72}}
.p{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}
.s{animation:sl 7s linear infinite}@keyframes sl{0%{transform:translateY(-30px)}100%{transform:translateY(250px)}}
.deg{animation:dg 22s linear infinite;transform-origin:427px 115px}@keyframes dg{to{transform:rotate(360deg)}}
.rv{animation:dg 34s linear infinite reverse;transform-origin:427px 115px}
.ty{overflow:hidden;white-space:nowrap;animation:ty 3s steps(34) infinite}@keyframes ty{0%{width:0}65%,100%{width:100%}}
</style><rect width="854" height="220" fill="#0D1117"/>
<rect x="20" y="16" width="814" height="188" rx="12" fill="#111722" stroke="#212936"/>
<text x="44" y="50" font-size="11" fill="#7AA2F7" letter-spacing="3">ABOUT</text>
<text x="44" y="86" font-size="17" fill="#E6EDF3">Инструменты вокруг API: ключи, схемы, контракты, трафик.</text>
<text x="44" y="116" font-size="14" fill="#8B949E">Структура и форматы вместо взлома и обхода авторизации.</text>
<text x="44" y="144" font-size="14" fill="#8B949E">В репозиториях — тесты, демо и понятный вывод.</text>
<text x="44" y="172" font-size="14" fill="#8B949E">тестовые ключи всегда фейковые.</text>
<g class="p"><circle cx="790" cy="108" r="25" fill="none" stroke="#BB9AF7" stroke-opacity=".55"/>
<circle cx="790" cy="108" r="6" fill="#BB9AF7"/></g>
</svg>