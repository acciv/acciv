<svg xmlns="http://www.w3.org/2000/svg" width="854" height="190" viewBox="0 0 854 190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" xml:space="preserve"><style>
.k{animation:kb 1.1s steps(1) infinite}@keyframes kb{50%{opacity:0}}
.f{animation:fi 5s infinite}@keyframes fi{0%,96%,100%{opacity:1}98%{opacity:.72}}
.p{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}
.s{animation:sl 7s linear infinite}@keyframes sl{0%{transform:translateY(-30px)}100%{transform:translateY(250px)}}
.deg{animation:dg 22s linear infinite;transform-origin:427px 115px}@keyframes dg{to{transform:rotate(360deg)}}
.rv{animation:dg 34s linear infinite reverse;transform-origin:427px 115px}
.ty{overflow:hidden;white-space:nowrap;animation:ty 3s steps(34) infinite}@keyframes ty{0%{width:0}65%,100%{width:100%}}
</style><rect width="854" height="190" fill="#0D1117"/>
<rect x="20" y="16" width="814" height="158" rx="12" fill="#111722" stroke="#212936"/>
<text x="44" y="50" font-size="11" fill="#7AA2F7" letter-spacing="3">ABOUT</text>
<text x="44" y="84" font-size="17" fill="#E6EDF3">Делаю инструменты вокруг API: ключи, схемы, контракты, трафик.</text>
<text x="44" y="112" font-size="14" fill="#8B949E">Смотрю на структуру и форматы, а не на взлом и обход авторизации.</text>
<text x="44" y="140" font-size="14" fill="#8B949E">В репозиториях — тесты, демо и понятный вывод. тестовые ключи — фейковые.</text>
<circle cx="790" cy="96" r="30" fill="none" stroke="#212936" stroke-dasharray="4 7" class="deg"/>
<circle cx="790" cy="96" r="8" fill="#7AA2F7" class="p"/>
</svg>