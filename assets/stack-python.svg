<svg xmlns="http://www.w3.org/2000/svg" width="82" height="64" viewBox="0 0 82 64" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve"><style>
.k{animation:kb 1.1s steps(1) infinite}@keyframes kb{50%{opacity:0}}
.f{animation:fi 5s infinite}@keyframes fi{0%,96%,100%{opacity:1}98%{opacity:.72}}
